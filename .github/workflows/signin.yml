name: TRAE 每日签到

on:
  push:
    branches: [main]
  schedule:
    # 每天 00:00 UTC = 08:00 北京时间
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        env:
          TRAE_AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          TRAE_AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
          TRAE_AUTH_3: ${{ secrets.TRAE_AUTH_3 }}
          TRAE_AUTH_4: ${{ secrets.TRAE_AUTH_4 }}
          TRAE_AUTH_5: ${{ secrets.TRAE_AUTH_5 }}
        run: |
          set -euo pipefail
          mkdir -p auths
          for i in 1 2 3 4 5; do
            var="TRAE_AUTH_$i"
            value="${!var:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" > "auths/trae-$i.json"
            fi
          done
          if ! compgen -G 'auths/trae-*.json' > /dev/null; then
            echo "未配置 TRAE_AUTH_1 至 TRAE_AUTH_5 中的任何凭证" >&2
            exit 1
          fi

      - name: 执行签到
        run: |
          set -o pipefail
          OUTPUT=$(./signin_bin auths 2>&1) || SIGNIN_EXIT=$?
          SIGNIN_EXIT=${SIGNIN_EXIT:-0}
          echo "$OUTPUT"
          {
            echo "SIGNIN_OUTPUT<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_ENV"
          exit "$SIGNIN_EXIT"

      - name: 提取结果
        id: result
        if: always()
        run: |
          echo "$SIGNIN_OUTPUT" | grep -oP '总计=\K\d+' | head -1 | xargs -I{} echo "total={}" >> "$GITHUB_OUTPUT" || echo "total=?" >> "$GITHUB_OUTPUT"
          echo "$SIGNIN_OUTPUT" | grep -oP '签到成功=\K\d+' | head -1 | xargs -I{} echo "ok={}" >> "$GITHUB_OUTPUT" || echo "ok=?" >> "$GITHUB_OUTPUT"
          echo "$SIGNIN_OUTPUT" | grep -oP '已签=\K\d+' | head -1 | xargs -I{} echo "already={}" >> "$GITHUB_OUTPUT" || echo "already=?" >> "$GITHUB_OUTPUT"
          echo "$SIGNIN_OUTPUT" | grep -oP '失败=\K\d+' | head -1 | xargs -I{} echo "fail={}" >> "$GITHUB_OUTPUT" || echo "fail=?" >> "$GITHUB_OUTPUT"

      - name: Bark 通知
        if: always()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          TITLE="✅ TRAE签到"
          if [ "${{ steps.result.outputs.fail }}" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到异常"
          fi
          BODY="总计${{ steps.result.outputs.total }} 成功${{ steps.result.outputs.ok }} 已签${{ steps.result.outputs.already }} 失败${{ steps.result.outputs.fail }}"
          if [ -n "$BARK_URL" ]; then
            TITLE_ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$TITLE")
            BODY_ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$BODY")
            curl --fail --silent --show-error -X POST "$BARK_URL/$TITLE_ENC/$BODY_ENC" || true
          fi

      - name: 清理凭证
        if: always()
        run: rm -rf auths
